name: Build Firmware

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install ARM GCC toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi
        
    - name: Build uConsole firmware
      run: make all KEYBOARD=uconsole

    - name: Build DevTerm firmware
      run: make all KEYBOARD=devterm

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: |
          build/uconsole_keyboard.bin
          build/uconsole_keyboard.hex
          build/devterm/devterm_keyboard.bin
          build/devterm/devterm_keyboard.hex
        retention-days: 90

